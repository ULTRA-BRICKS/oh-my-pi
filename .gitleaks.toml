# .gitleaks.toml — read automatically by gitleaks (the secret-scan CI workflow and local hooks).
#
# Extends gitleaks' default rules. Without these allowlists the tree scan reports 112
# generic-rule hits in upstream oh-my-pi content, none of them a real secret (checked by hand on
# 2026-09-26).
title = "oh-my-pi"

[extend]
useDefault = true

# Whole paths: upstream test fixtures (fake keys, tokens and PEM blocks that exercise redaction
# and auth flows) and the generated model catalog (tokenizer ids, not credentials).
[[allowlists]]
description = "Upstream test fixtures and generated model metadata"
paths = [
  '''packages/[^/]+/test/''',
  '''packages/catalog/src/models\.json$''',
]

# Source and docs: only these exact known values, never the files they live in, so a real
# credential added anywhere is still caught. (gitleaks 8.30 skips a whole file for a matching
# `paths` entry even under condition = "AND", so value-only is the precise form.)
[[allowlists]]
description = "Known upstream non-secrets, by value"
regexes = [
  '''^interleaved-thinking-\d{4}-\d{2}-\d{2}$''',                         # Anthropic API beta header name (anthropic.ts)
  '''^whisper-large-v3-turbo$''',                                         # STT model id (stt/models.ts)
  '''^Perplexity/\d+$''',                                                 # OAuth user-agent string (perplexity.ts)
  '''^36f2a70cddeb5a0889d4fd8295c241b7e9848e89cf9e599d0eed2d8e5350''',      # public GitLab Duo OAuth client id (docs/provider-quirks.md)
  '''MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQCmpGe5T8B0oA2L''',   # claude-trace's throwaway local debug-proxy key (claude-trace-cli.ts)
]
